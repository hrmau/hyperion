name: Refresh energy data

# Checks OWID for newer data and opens a PR when there is any.
#
# Deliberately opens a PR rather than pushing to main. A refresh changes figures
# published on the site, and it can invalidate the hand-written insight lines in
# the Higher/Lower bank — scripts/generate-questions.js refuses to ship a question
# whose winner has flipped, and the PR body quotes any line that has gone stale.
# Those need a person, so the last step is a human clicking merge. Vercel deploys
# from main on merge.

on:
  schedule:
    # Mondays 06:00 UTC. OWID publishes irregularly, roughly monthly; a run that
    # finds nothing new costs a minute and opens no PR.
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: refresh-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: npm ci

      # Keep a copy of what is live so the PR can describe what actually changed.
      - name: Snapshot current data
        run: |
          mkdir -p /tmp/baseline
          cp public/data/*.json /tmp/baseline/

      - name: Fetch upstream dataset
        id: fetch
        run: npm run fetch-data

      - name: Rebuild derived data
        run: |
          npm run transform-data
          npm run generate-questions -- --report /tmp/report.md

      - name: Validate
        # Fails the job outright on a bad upstream release — countries vanishing,
        # years going backwards, source sums not adding up. Nothing reaches a
        # reviewer as a mergeable PR unless it passes.
        run: node scripts/check-data.js --baseline /tmp/baseline --report /tmp/coverage.md

      - name: Build
        run: npm run build

      - name: Detect changes
        id: diff
        run: |
          if git diff --quiet -- public/data; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No data changes — nothing to propose."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Assemble PR body
        if: steps.diff.outputs.changed == 'true'
        run: |
          {
            echo "Automated refresh from [Our World in Data](https://ourworldindata.org/energy) (CC BY 4.0)."
            echo
            echo "Upstream last modified: \`${{ steps.fetch.outputs.last_modified }}\`"
            echo
            cat /tmp/coverage.md
            echo
            cat /tmp/report.md
            echo
            echo "---"
            echo
            echo "Generated by \`.github/workflows/refresh-data.yml\`. Rerun locally with \`npm run refresh-data\`."
            echo "The source CSV is not committed — it is fetched on each run."
          } > /tmp/pr-body.md

      - name: Open pull request
        if: steps.diff.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v8
        with:
          branch: data/refresh
          # Reuse one branch so repeated runs update the open PR rather than
          # stacking up a new one every week.
          title: 'Data refresh from OWID'
          body-path: /tmp/pr-body.md
          commit-message: |
            Refresh energy data from OWID

            Regenerated countries-yearly.json, owid-aggregates.json,
            fossil-fuel-independence.json and questions.json from the upstream
            dataset. See the PR body for coverage changes and any insight lines
            that need rewriting.
          add-paths: public/data
          delete-branch: false
