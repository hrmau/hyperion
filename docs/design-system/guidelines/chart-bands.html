<!-- @dsCard group="Charts" viewport="700x150" subtitle="1.4px in the WELL colour — a gap, not a stroke" name="Band separators" -->
<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{padding:20px;font-family:var(--font-sans)}.sw{display:flex;gap:0;flex-wrap:wrap}.c{flex:1;min-width:0;padding:10px 8px;font-family:var(--font-mono);font-size:9.5px;letter-spacing:.04em;display:flex;flex-direction:column;justify-content:flex-end;height:74px}.mono{font-family:var(--font-mono)}</style>
</head><body>
<div style="display:flex;gap:16px">
  <div style="flex:1">
    <svg viewBox="0 0 240 88" preserveAspectRatio="none" style="width:100%;height:88px;background:var(--chart-well);border-radius:8px">
      <polygon points="0,0 240,0 240,30 0,44" fill="var(--fuel-wind)"/><polygon points="0,44 240,30 240,40 0,52" fill="var(--fuel-solar)"/><polygon points="0,52 240,40 240,66 0,72" fill="var(--fuel-gas)"/><polygon points="0,72 240,66 240,88 0,88" fill="var(--fuel-coal)"/>
      <polyline points="0,44 240,30" fill="none" stroke="var(--chart-sep)" stroke-width="1.4" vector-effect="non-scaling-stroke"/><polyline points="0,52 240,40" fill="none" stroke="var(--chart-sep)" stroke-width="1.4" vector-effect="non-scaling-stroke"/><polyline points="0,72 240,66" fill="none" stroke="var(--chart-sep)" stroke-width="1.4" vector-effect="non-scaling-stroke"/>
    </svg>
    <div class="mono" style="font-size:9.5px;color:var(--green);margin-top:7px;letter-spacing:.06em">WITH SEPARATORS — CORRECT</div>
  </div>
  <div style="flex:1">
    <svg viewBox="0 0 240 88" preserveAspectRatio="none" style="width:100%;height:88px;background:var(--chart-well);border-radius:8px">
      <polygon points="0,0 240,0 240,30 0,44" fill="var(--fuel-wind)"/><polygon points="0,44 240,30 240,40 0,52" fill="var(--fuel-solar)"/><polygon points="0,52 240,40 240,66 0,72" fill="var(--fuel-gas)"/><polygon points="0,72 240,66 240,88 0,88" fill="var(--fuel-coal)"/>
    </svg>
    <div class="mono" style="font-size:9.5px;color:var(--clay);margin-top:7px;letter-spacing:.06em">WITHOUT — ADJACENT BANDS BLEED</div>
  </div>
</div></body></html>
