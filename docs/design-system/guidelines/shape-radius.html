<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{padding:20px;font-family:var(--font-sans)}.sw{display:flex;gap:0;flex-wrap:wrap}.c{flex:1;min-width:0;padding:10px 8px;font-family:var(--font-mono);font-size:9.5px;letter-spacing:.04em;display:flex;flex-direction:column;justify-content:flex-end;height:74px}.mono{font-family:var(--font-mono)}</style>
</head><body>
<div style="display:flex;gap:14px;align-items:center;flex-wrap:wrap">
  <div style="width:64px;height:44px;background:var(--ink-600);border-radius:6px;display:grid;place-items:center;font-family:var(--font-mono);font-size:10px;color:var(--text-tertiary)">6</div>
  <div style="width:64px;height:44px;background:var(--ink-700);border-radius:8px;display:grid;place-items:center;font-family:var(--font-mono);font-size:10px;color:var(--text-tertiary)">8</div>
  <div style="width:64px;height:44px;background:var(--paper);border-radius:10px;display:grid;place-items:center;font-family:var(--font-mono);font-size:10px;color:var(--ink-900)">10</div>
  <div style="width:64px;height:44px;background:var(--ink-700);border:1px solid var(--line);border-radius:16px;display:grid;place-items:center;font-family:var(--font-mono);font-size:10px;color:var(--text-tertiary)">16</div>
  <div style="padding:9px 16px;border:1px solid var(--line-strong);border-radius:99px;font-family:var(--font-mono);font-size:10px;color:var(--text-tertiary)">99</div>
  <div style="flex:1;min-width:120px"><div style="height:1px;background:var(--line-strong)"></div><div style="height:1px;background:var(--line);margin-top:9px"></div><div style="height:1px;background:var(--line-soft);margin-top:9px"></div></div>
</div></body></html>
