<!-- @dsCard group="Colors" viewport="700x150" subtitle="Fuel tints for TEXT — never for fills" name="Fuel text tints" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{padding:20px;font-family:var(--font-sans)}</style></head><body>
<div style="font-size:28px;font-weight:700;letter-spacing:-.03em;max-width:26ch">Ireland burns gas for <span style="color:var(--fuel-gas-ink)">42%</span> of its power — and is second in the world for <span style="color:var(--fuel-wind-ink)">wind</span>.</div>
<div style="display:flex;gap:18px;margin-top:16px;font-family:var(--font-mono);font-size:10.5px;letter-spacing:.06em">
  <span style="color:var(--fuel-coal-ink)">COAL-INK</span><span style="color:var(--fuel-gas-ink)">GAS-INK</span><span style="color:var(--fuel-nuclear-ink)">NUCLEAR-INK</span><span style="color:var(--fuel-hydro-ink)">HYDRO-INK</span><span style="color:var(--fuel-solar-ink)">SOLAR-INK</span><span style="color:var(--fuel-wind-ink)">WIND-INK</span>
</div>
<div style="display:flex;gap:18px;margin-top:10px;font-family:var(--font-mono);font-size:10.5px;letter-spacing:.06em;color:var(--clay)">
  <span style="color:var(--fuel-coal)">COAL FILL AS TEXT — FAILS</span><span style="color:var(--fuel-gas)">GAS FILL AS TEXT — FAILS</span>
</div>
</body></html>
