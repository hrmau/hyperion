<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{padding:20px;font-family:var(--font-sans)}.sw{display:flex;gap:0;flex-wrap:wrap}.c{flex:1;min-width:0;padding:10px 8px;font-family:var(--font-mono);font-size:9.5px;letter-spacing:.04em;display:flex;flex-direction:column;justify-content:flex-end;height:74px}.mono{font-family:var(--font-mono)}</style>
</head><body>
<div class="sw">
  <div class="c" style="background:var(--scale-1);color:var(--paper-a66);height:60px">1</div>
  <div class="c" style="background:var(--scale-2);color:var(--paper-a66);height:60px">2</div>
  <div class="c" style="background:var(--scale-3);color:var(--paper-a76);height:60px">3</div>
  <div class="c" style="background:var(--scale-4);color:var(--paper);height:60px">4</div>
  <div class="c" style="background:var(--scale-5);color:#16201f;height:60px">5</div>
  <div class="c" style="background:var(--scale-6);color:#17301f;height:60px">6</div>
  <div class="c" style="background:var(--scale-7);color:var(--green-ink);height:60px">7</div>
</div>
<div class="mono" style="font-size:10.5px;color:var(--text-quiet);margin-top:10px;letter-spacing:.06em">LOW → HIGH. USE scaleColor(value, min, max) FROM components/data/fuels.js.<br>TEXT ON A STOP USES --on-scale-*; ALL SEVEN CLEAR 4.5:1.</div></body></html>
