<!-- @dsCard group="Spacing" viewport="700x210" subtitle="Load-bearing distinction — never swap them" name="Tabs vs pills" -->
<!doctype html>
<html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{padding:20px;font-family:var(--font-sans)}.mono{font-family:var(--font-mono)}</style>
</head><body>
<div style="display:grid;grid-template-columns:1fr 1fr;gap:26px">
<div>
<div class="mono" style="font-size:10px;letter-spacing:.18em;color:var(--text-label);margin-bottom:12px">TABS CHANGE THE VIEW</div>
<div style="display:flex;gap:26px;border-bottom:1px solid var(--line)">
<span style="padding-bottom:10px;margin-bottom:-1px;border-bottom:2px solid var(--paper);font-size:13.5px;font-weight:500">Generation mix</span>
<span style="padding-bottom:10px;font-size:13.5px;font-weight:500;color:var(--text-secondary)">Trends</span>
<span style="padding-bottom:10px;font-size:13.5px;font-weight:500;color:var(--text-secondary)">Peers</span>
</div>
<div style="font-size:13px;color:var(--text-tertiary);margin-top:12px;line-height:1.5">Same subject, different section of the page.</div>
</div>
<div>
<div class="mono" style="font-size:10px;letter-spacing:.18em;color:var(--text-label);margin-bottom:12px">PILLS CHANGE THE DATASET</div>
<div style="display:flex;gap:10px;flex-wrap:wrap">
<span style="padding:7px 14px;border-radius:99px;background:var(--paper);color:var(--ink-900);font-size:13.5px;font-weight:500">World</span>
<span style="padding:7px 14px;border-radius:99px;border:1px solid var(--line-strong);font-size:13.5px;font-weight:500">European Union</span>
<span style="padding:7px 14px;border-radius:99px;border:1px solid var(--line-strong);font-size:13.5px;font-weight:500">China</span>
</div>
<div style="font-size:13px;color:var(--text-tertiary);margin-top:12px;line-height:1.5">Same chart, redrawn for different data.</div>
</div>
</div>
<div class="mono" style="font-size:10.5px;color:var(--text-quiet);margin-top:22px;letter-spacing:.05em">SELECTED STATE IS AN INVERSE FILL IN BOTH CASES — SELECTION IS NEVER GREEN. GREEN IS THE ACCENT, NOT A STATE.</div></body></html>
