<!-- @dsCard group="Components" viewport="700x990" name="Feedback & overlays" subtitle="Banner, Toast, Tooltip, EmptyState, Skeleton, Modal, Drawer, Menu" -->
<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18/umd/react.development.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="../../_ds_bundle.js"></script>
<style>body{padding:20px}</style>
</head><body><div id="root"></div>
<script type="text/gg-babel">
const { Banner, Toast, Tooltip, DefinedTerm, EmptyState, ErrorState, Skeleton, ChartSkeleton, Spinner, ProgressBar, Button, MenuItem } = window.GridGorilla;
ReactDOM.createRoot(document.getElementById('root')).render(
<div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:22}}>
  <div style={{display:'flex',flexDirection:'column',gap:14}}>
    <Banner tone="caution" label="Data vintage">Nigeria's 2026 figures are provisional — the last audited year is 2024.</Banner>
    <Banner tone="accent" label="New" action={<Button size="sm" variant="secondary">Read it</Button>}>Solar passed nuclear worldwide this quarter.</Banner>
    <Banner label="Heads up" onDismiss={()=>{}}>Rankings are computed on the most recent full year, not year-to-date.</Banner>
    <div style={{display:'flex',gap:12,alignItems:'center'}}>
      <Toast tone="accent">Copied Ireland's figures</Toast><Spinner/>
    </div>
    <div style={{fontSize:15,color:'var(--text-secondary)'}}>Wind's <DefinedTerm term="capacity factor" definition="Actual output ÷ theoretical maximum"/> is about 35% onshore. Hover <Tooltip label="52,300 kWh"><span style={{color:'var(--green)'}}>Iceland</span></Tooltip>.</div>
    <ProgressBar value={4} max={10} label="Round" />
  </div>
  <div style={{display:'flex',flexDirection:'column',gap:14}}>
    <EmptyState label="No results" title="No grid matches “Wakanda”." action={<Button variant="secondary" size="sm">Clear search</Button>}>Try an ISO code, or browse the full rankings.</EmptyState>
    <ErrorState onRetry={()=>{}}>The Ember feed didn't respond. Nothing is wrong with your connection.</ErrorState>
    <div style={{display:'flex',flexDirection:'column',gap:8}}>
      <Skeleton width="60%" height={22}/><Skeleton width="90%"/><Skeleton width="75%"/>
      <ChartSkeleton height={110} style={{marginTop:6}}/>
    </div>
    <div style={{background:'var(--ink-700)',border:'1px solid var(--line-strong)',borderRadius:10,overflow:'hidden'}}>
      <MenuItem selected meta="214">All countries</MenuItem><MenuItem meta="27">European Union</MenuItem><MenuItem meta="7">G7</MenuItem>
    </div>
  </div>
</div>);
</script></body></html>
